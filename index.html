
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas - Instituto i3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <h1>Instituto i3</h1>
        <h2>Calculadora de Notas</h2>
        <p>Ingresa los datos del estudiante y sus tres calificaciones.</p>

        <form id="formulario">
            <label for="nombre">Nombre del estudiante:</label>
            <input type="text" id="nombre" placeholder="Nombre completo">

            <label for="nota1">Primera nota (0 a 5):</label>
            <input type="number" id="nota1" min="0" max="5" step="0.1">

            <label for="nota2">Segunda nota (0 a 5):</label>
            <input type="number" id="nota2" min="0" max="5" step="0.1">

            <label for="nota3">Tercera nota (0 a 5):</label>
            <input type="number" id="nota3" min="0" max="5" step="0.1">

            <button type="submit">Calcular promedio</button>
            <button type="reset" class="secundario">Limpiar</button>
        </form>

        <div id="resultado" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
